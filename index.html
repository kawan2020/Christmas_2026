<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MERRY CHRISTMAS</title>

  <!-- WhatsApp & Social Media Preview Meta Tags -->
  <meta property="og:title" content="Christmas Wishes" />
  <meta property="og:description" content="From toys to retirement dreams, Father Christmas hears a lifetime of wishing." />
  <meta property="og:image" content="https://kawan2020.github.io/Christmas_2026/images/preview.jpg" />
  <meta property="og:url" content="https://kawan2020.github.io/Christmas_2026/" />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Background Image Layer -->
  <div id="bg-layer"></div>

  <!-- Particle Canvas Layer -->
  <canvas id="particle-canvas"></canvas>

  <!-- Landscape Warning -->
  <div id="landscape-warning">
    <p>📱 Please rotate your device to portrait mode for the best viewing experience.</p>
  </div>

  <!-- Header -->
  <header id="main-header">
    <h2>Merry Christmas</h2>
    <p>🎄🎄🎅🎄🎄</p>
  </header>

  <!-- 3D Scene Viewport -->
  <div class="scene">
    <button class="nav-arrow prev-arrow" id="prev-btn" aria-label="Previous Image">&#10094;</button>
    
    <div class="box" id="box">
      <!-- Images injected via JavaScript -->
    </div>

    <button class="nav-arrow next-arrow" id="next-btn" aria-label="Next Image">&#10095;</button>
  </div>

  <!-- Pagination Dots Indicator -->
  <div class="pagination-dots" id="pagination-dots">
    <!-- Dots injected via JavaScript -->
  </div>

  <!-- Audio Elements -->
  <audio id="bg-music" src="music/background.mp3" loop preload="auto"></audio>
  <audio id="sound-tap" src="music/effect1.mp3" preload="auto"></audio>
  <audio id="sound-swipe" src="music/effect2.mp3" preload="auto"></audio>

  <!-- Bottom-Right Mute/Play Toggle Button -->
  <button id="audio-toggle-btn" class="audio-btn playing" aria-label="Toggle Audio">
    <span id="audio-icon">🔊</span>
  </button>

  <script src="script.js"></script>
</body>
</html>
